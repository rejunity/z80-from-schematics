# LibreLane Chip flow: z80_chip, the Z80 as a chip on gf180mcuD --
# z80_top, hardened as a macro, in a ring of 40 I/O pads placed like the original Z80's
# bond pads (z80_chip.v, pads.tcl), with the seal ring, metal fill and the
# chip-level checks. `make chip` runs it; ../config.yaml still hardens
# z80_top alone (`make`), and the two never share a run directory.
#
# The pad ring follows open-pdks' LibreLane config for gf180mcu_fd_io
# (the PDK version LibreLane 3.0.14 pins predates it) and the wafer.space
# gf180mcu project template (both Apache-2.0).
meta:
  version: 3
  flow: Chip

DESIGN_NAME: z80_chip
VERILOG_FILES:
  - dir::z80_chip.v

# the clock enters through the CLK pad
CLOCK_PORT: CLK
CLOCK_NET: pad_CLK/Y
CLOCK_PERIOD: 50
PNR_SDC_FILE: dir::chip.sdc
SIGNOFF_SDC_FILE: dir::chip.sdc

VDD_NETS: [VDD]
GND_NETS: [VSS]

# Pad-limited die: 12 pads along the bottom as on the Z80, with room for
# its spacing. Aspect 0.94, the Z80 die's; width as wafer.space's half
# slot. The core sits inside the pad ring and its supply ring.
FP_SIZING: absolute
DIE_AREA: [0, 0, 1936, 2060]
CORE_AREA: [442, 442, 1494, 1618]
GRT_ALLOW_CONGESTION: true

# ---- the core: z80_top as a hard macro ----
# Hardened by ../config.yaml (`make`), with its pins on the sides of their
# pads (../pin_order.cfg) and power straps the chip's grid connects to;
# `make chip` copies its latest run's views into macro/. The chip run then
# only places it, routes the pad wires and the power, and checks the die.
MACROS:
  z80_top:
    gds: [dir::macro/z80_top.gds]
    lef: [dir::macro/z80_top.lef]
    vh: [dir::macro/z80_top.vh]
    nl: [dir::macro/z80_top.nl.v]
    pnl: [dir::macro/z80_top.pnl.v]
    lib:
      "*_tt_025C_5v00": [dir::macro/lib/tt.lib]
      "*_ss_125C_4v50": [dir::macro/lib/ss.lib]
      "*_ff_n40C_5v50": [dir::macro/lib/ff.lib]
    instances:
      u_top:
        location: [695, 745]
        orientation: N
PDN_MACRO_CONNECTIONS:
  - "u_top VDD VSS VDD VSS"

# ---- pad ring (gf180mcu_fd_io) ----
PAD_CFG: dir::pads.tcl
PAD_SOUTH: [pad_A5, pad_A6, pad_A7, pad_A8, pad_A9, pad_A10, pad_A11, pad_A12, pad_A13, pad_A14, pad_A15, pad_CLK]
PAD_EAST: [pad_D4, pad_D3, pad_D5, pad_D6, pad_VCC, pad_D2, pad_D7, pad_D0, pad_D1]
PAD_NORTH: [pad_WAIT_n, pad_BUSAK_n, pad_WR_n, pad_RD_n, pad_IORQ_n, pad_MREQ_n, pad_HALT_n, pad_NMI_n, pad_INT_n]
PAD_WEST: [pad_A4, pad_A3, pad_A2, pad_A1, pad_A0, pad_GND, pad_RFSH_n, pad_M1_n, pad_RESET_n, pad_BUSRQ_n]
PAD_SITE_NAME: GF_IO_Site
PAD_CORNER_SITE_NAME: GF_COR_Site
PAD_FAKE_SITES:
  GF_IO_Site: [0.1, 355]
  GF_COR_Site: [355, 355]
PAD_EDGE_SPACING: 26
PAD_CORNER: [gf180mcu_fd_io__cor]
PAD_FILLERS: [gf180mcu_fd_io__fill10, gf180mcu_fd_io__fill5, gf180mcu_fd_io__fill1, gf180mcu_fd_io__fillnc]
PAD_PLACE_IO_TERMINALS:
  - gf180mcu_fd_io__bi_24t/PAD
  - gf180mcu_fd_io__in_c/PAD
  - gf180mcu_fd_io__in_s/PAD
  - gf180mcu_fd_io__dvss/DVSS
  - gf180mcu_fd_io__dvdd/DVDD
PAD_LEFS:
  - pdk_dir::libs.ref/gf180mcu_fd_io/lef/gf180mcu_fd_io__*.lef
PAD_GDS:
  - pdk_dir::libs.ref/gf180mcu_fd_io/gds/gf180mcu_fd_io.gds
# blackbox views (the PDK's behavioural model does not lint)
PAD_VERILOG_MODELS:
  - dir::pads_bb.v
PAD_SPICE_MODELS:
  - pdk_dir::libs.ref/gf180mcu_fd_io/spice/gf180mcu_fd_io.spice
PAD_CDLS:
  - pdk_dir::libs.ref/gf180mcu_fd_io/cdl/gf180mcu_fd_io.cdl
PAD_LIBS:
  "*_tt_025C_5v00": [pdk_dir::libs.ref/gf180mcu_fd_io/lib/gf180mcu_fd_io__tt_025C_5v00.lib]
  "*_ff_n40C_5v50": [pdk_dir::libs.ref/gf180mcu_fd_io/lib/gf180mcu_fd_io__ff_n40C_5v50.lib]
  "*_ss_125C_4v50": [pdk_dir::libs.ref/gf180mcu_fd_io/lib/gf180mcu_fd_io__ss_125C_4v50.lib]
# the output-only pads leave the bidirectional cell's input (Y) open
IGNORE_DISCONNECTED_MODULES: [gf180mcu_fd_io__bi_24t]

# ---- power: stdcell grid, core ring, ring to pad ring ----
PDN_CFG: dir::pdn.tcl
PDN_ENABLE_PINS: false
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75
PDN_CORE_RING: true
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_CORE_RING_CONNECT_TO_PADS: true
PDN_CORE_VERTICAL_LAYER: Metal4
PDN_CORE_HORIZONTAL_LAYER: Metal3

# ---- sign-off details of the I/O cells (wafer.space template) ----
# several supply pads per domain on the ring
MAGIC_EXT_UNIQUE: notopports
# flatten the I/O cells' devices for Magic DRC (no false errors)
MAGIC_GDS_FLATGLOB: ["*_CDNS_*", "M1_N*", "M1_P*", "M2_M1*", "M3_M2*", "nmos_5p0*", "nmos_1p2*",
                     "pmos_5p0*", "pmos_1p2*", "via1_*", "G_ring_*"]
# Metal2 density cannot be met around the pad ring: fill ignores it
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true
