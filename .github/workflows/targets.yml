# Main's core on every FPGA board and ASIC PDK. Each board branch
# (fpga-<board>-basic) and PDK branch (asic-<pdk>) is merged into main's
# tree and run through its flow: FPGA bitstreams + simulations
# (fpga-board.yml), ASIC RTL-to-GDS + sign-off + gate-level signs of life
# (asic-pdk.yml). The branches run the same jobs on their own pushes
# (fpga-<board>.yml, asic-<pdk>.yml).
#
# Every push to main, nightly -- the FPGA tools are pip's latest, so this
# also catches toolchain drift -- and on demand. When every target passed
# on main, pages.yml publishes the downloads and the layout renders on
# GitHub Pages: https://rejunity.github.io/z80-from-schematics/
name: Targets

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  schedule:
    - cron: '30 4 * * *'        # 04:30 UTC daily, after CI's 04:00
  workflow_dispatch: {}

concurrency:
  group: targets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fpga:
    strategy:
      fail-fast: false
      matrix:
        board: [icepi-zero, tang-primer-25k, icebreaker, pico-ice, icesugar]
    uses: ./.github/workflows/fpga-board.yml
    with:
      board: ${{ matrix.board }}

  asic:
    strategy:
      fail-fast: false
      matrix:
        pdk: [sky130, ihp-sg13g2, gf180mcu, gf180mcu-9t]
    uses: ./.github/workflows/asic-pdk.yml
    with:
      pdk: ${{ matrix.pdk }}

  # The I/O pads at transistor level, every pad cell the chips use, in
  # ngspice against the committed results (spice-pads.yml; ~10 min)
  spice:
    strategy:
      fail-fast: false
      matrix:
        pdk: [gf180mcu, ihp-sg13g2]
    uses: ./.github/workflows/spice-pads.yml
    with:
      pdk: ${{ matrix.pdk }}
