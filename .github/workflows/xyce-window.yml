# Xyce as the Transistor run's second engine, on one of its windows:
# chip.py's xyce step runs the window's own deck -- from the node voltages
# ngspice started it from -- on Xyce's fast path (UMFPACK with METIS, the
# MPI build over 4 ranks; engines.py), and checks its pins against
# ngspice's and the RTL's: a missing output edge, an edge or a settled
# level past engines.WINDOW_TOL, or any pin against the RTL fails it.
# ngspice stays the run's engine (stitch and figures read its pins).
# Xyce runs at the run's corners that are in engines.XYCE_CORNERS (one
# list, test_engines.py checks it); the corners job names any it leaves
# out in the run's summary.
# Called by transistor.yml once ngspice has run the window.
name: Xyce window

on:
  workflow_call:
    inputs:
      window:
        description: the window, 1-based
        type: number
        required: true
      corners:
        description: corners, as a JSON list
        type: string
        required: true

permissions:
  contents: read

env:
  LIBRELANE_VERSION: 3.0.14      # as transistor.yml: the PDK's cache, and ciel

defaults:
  run:
    shell: bash

jobs:
  corners:
    name: Xyce's corners of ${{ inputs.corners }} (engines.XYCE_CORNERS)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      list: ${{ steps.c.outputs.list }}
    steps:
      - uses: actions/checkout@v5
      - id: c
        env:
          CORNERS: ${{ inputs.corners }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          sys.path.insert(0, "asic/spice")
          import engines
          asked = json.loads(os.environ["CORNERS"])
          run = [c for c in asked if c in engines.XYCE_CORNERS]
          out = [c for c in asked if c not in engines.XYCE_CORNERS]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"Xyce, window ${{ inputs.window }}: at {', '.join(run) or 'no corner'}"
                      + (f"; not at {', '.join(out)} (not in engines.XYCE_CORNERS, "
                         f"{', '.join(engines.XYCE_CORNERS)})" if out else "") + "\n")
          for c in out:
              print(f"::notice::Xyce does not run at {c} (engines.XYCE_CORNERS)", file=sys.stderr)
          print("list=" + json.dumps(run))
          PY

  xyce:
    name: Xyce on window ${{ inputs.window }} of 4 (${{ matrix.corner }})
    needs: corners
    if: needs.corners.outputs.list != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        corner: ${{ fromJSON(needs.corners.outputs.list) }}
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://nix-cache.fossi-foundation.org
            extra-trusted-public-keys = nix-cache.fossi-foundation.org:3+K59iFwXqKsL7BNu6Guy0v+uTlwsxYQxjspXzqLYQs=
            extra-experimental-features = nix-command flakes

      # the PDK as asic-pdk.yml caches it for the GF180 chip (read only)
      - name: The PDK from the ASIC job's cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ciel
          key: ciel-gf180mcu-librelane-${{ env.LIBRELANE_VERSION }}

      - name: Fetch the PDK (LibreLane's ciel)
        run: |
          root=$(python3 -c "import sys; sys.path.insert(0, 'asic/spice'); import pads; print(pads.PDKS['gf180mcu']['root'])")
          [ -d ~/.ciel/ciel/$root ] ||
            scripts/nix_retry.sh nix run github:librelane/librelane/$LIBRELANE_VERSION#python3.pkgs.ciel -- fetch --pdk-root ~/.ciel \
              --pdk-family $(cut -d/ -f1 <<< "$root") $(cut -d/ -f3 <<< "$root")

      - name: Xyce, the MPI build (xyce.yml's cache entry; never built here)
        uses: ./.github/actions/xyce
        with:
          variant: mpi

      - name: numpy (engines.py's comparison)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-numpy

      - name: The netlist and the RTL's reference
        uses: actions/download-artifact@v8
        with:
          name: transistor-netlist
          path: work

      - name: ngspice's windows 1-${{ inputs.window }} at ${{ matrix.corner }}
        uses: actions/download-artifact@v8
        with:
          name: transistor-${{ matrix.corner }}-${{ inputs.window }}
          path: work/${{ matrix.corner }}/seg

      - name: Xyce on window ${{ inputs.window }} of 4, against ngspice
        run: |
          set -o pipefail
          rc=0
          python3 asic/spice/chip.py ci --work work --corner ${{ matrix.corner }} --threads 4 \
            --steps xyce --segment ${{ inputs.window }}/4 2>&1 | tee xyce.txt || rc=$?
          { echo "### Xyce, window ${{ inputs.window }} at ${{ matrix.corner }}"; echo '```'
            grep '^chip: Xyce' xyce.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: transistor-xyce-${{ matrix.corner }}-${{ inputs.window }}
          path: |
            work/${{ matrix.corner }}/seg/xyce_*/result.json
            work/${{ matrix.corner }}/seg/xyce_*/*.dat
            work/${{ matrix.corner }}/seg/xyce_*/*.log
          retention-days: 14
