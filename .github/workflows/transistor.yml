# The whole GF180 chip at transistor level (asic/spice/chip.py), on demand.
# The chip's GDS from main's latest Targets run, extracted to its
# transistors with Magic; the test program -- power-up, RESET, LD A,5Ah /
# LD (8000h),A / OUT (42h),A / IN A,(43h) / HALT at 4 MHz -- in ngspice at
# each corner, in 4 windows of about 3.3 us, one job each (a GitHub job stops
# at 6 hours): every window starts from the node voltages the one before
# ended with, cut where the chip has settled before a clock edge. Then the
# pins against the RTL, every AC parameter of the datasheet over every
# cycle, and the figures, as the artifact transistor-gf180mcu
# (spice/chip/gf180mcu/: tt's; the other corners' in <corner>/).
#
# Xyce, the second engine: once ngspice has run a window, xyce-window.yml
# runs the same deck from the same state on Xyce's fast path (UMFPACK with
# METIS, MPI over 4 ranks) and fails on an output edge missing or past
# engines.WINDOW_TOL, or any pin against the RTL; it runs beside ngspice's
# next window. xyce.yml builds Xyce (or takes it from the cache) first.
#
# Hours: about half a day for the three corners side by side. A short run:
# windows = 1 (ngspice and Xyce on the first window only; no figures).
name: Transistor

on:
  workflow_dispatch:
    inputs:
      corners:
        description: corners, as a JSON list
        default: '["tt", "ss", "ff"]'
      windows:
        description: windows to run of the 4 (fewer, a short run without the figures)
        type: number
        default: 4

permissions:
  contents: read
  actions: read           # main's latest Targets run, for the chip's GDS

concurrency:
  group: transistor
  cancel-in-progress: false

env:
  LIBRELANE_VERSION: 3.0.14      # as asic-pdk.yml: its PDK cache, and ciel

defaults:
  run:
    shell: bash

jobs:
  netlist:
    name: the chip extracted, and the RTL's reference
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      targets_run: ${{ steps.gds.outputs.run }}
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://nix-cache.fossi-foundation.org
            extra-trusted-public-keys = nix-cache.fossi-foundation.org:3+K59iFwXqKsL7BNu6Guy0v+uTlwsxYQxjspXzqLYQs=
            extra-experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # the PDK as asic-pdk.yml caches it for the GF180 chip (read only)
      - name: The PDK from the ASIC job's cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ciel
          key: ciel-gf180mcu-librelane-${{ env.LIBRELANE_VERSION }}

      - name: Fetch the PDK (LibreLane's ciel)
        run: |
          root=$(python3 -c "import sys; sys.path.insert(0, 'asic/spice'); import pads; print(pads.PDKS['gf180mcu']['root'])")
          [ -d ~/.ciel/ciel/$root ] ||
            scripts/nix_retry.sh nix run github:librelane/librelane/$LIBRELANE_VERSION#python3.pkgs.ciel -- fetch --pdk-root ~/.ciel \
              --pdk-family $(cut -d/ -f1 <<< "$root") $(cut -d/ -f3 <<< "$root")

      - name: The simulators, pinned (nix; a broken download again, then built)
        run: scripts/nix_retry.sh nix build --no-link $(python3 -c 'import sys; sys.path.insert(0, "asic/spice"); import pads; print(*(pads.TOOLS[t] for t in sys.argv[1:]))' magic)

      - name: The chip's GDS, from main's latest Targets run
        id: gds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow targets.yml --branch main --status success \
                 --limit 1 --json databaseId -q '.[0].databaseId')
          gh run download "$id" -R "$GITHUB_REPOSITORY" -n asic-gf180mcu-gds -D gds
          echo "run=$id" >> "$GITHUB_OUTPUT"
          echo "Targets run $id: $(ls -l gds/rz80-gf180mcu-chip.gds)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: iverilog (the RTL's reference)
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Extract the layout (Magic, ~25 min) and run the RTL
        run: python3 asic/spice/chip.py ci --work work --gds gds/rz80-gf180mcu-chip.gds --steps extract,reference

      - uses: actions/upload-artifact@v6
        with:
          name: transistor-netlist
          path: |
            work/z80_chip.spice
            work/ref.txt
          retention-days: 14

  window1:
    name: window 1 of 4 (${{ matrix.corner }})
    needs: netlist
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        corner: ${{ fromJSON(inputs.corners) }}
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://nix-cache.fossi-foundation.org
            extra-trusted-public-keys = nix-cache.fossi-foundation.org:3+K59iFwXqKsL7BNu6Guy0v+uTlwsxYQxjspXzqLYQs=
            extra-experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # the PDK as asic-pdk.yml caches it for the GF180 chip (read only)
      - name: The PDK from the ASIC job's cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ciel
          key: ciel-gf180mcu-librelane-${{ env.LIBRELANE_VERSION }}

      - name: Fetch the PDK (LibreLane's ciel)
        run: |
          root=$(python3 -c "import sys; sys.path.insert(0, 'asic/spice'); import pads; print(pads.PDKS['gf180mcu']['root'])")
          [ -d ~/.ciel/ciel/$root ] ||
            scripts/nix_retry.sh nix run github:librelane/librelane/$LIBRELANE_VERSION#python3.pkgs.ciel -- fetch --pdk-root ~/.ciel \
              --pdk-family $(cut -d/ -f1 <<< "$root") $(cut -d/ -f3 <<< "$root")

      - name: The simulators, pinned (nix; a broken download again, then built)
        run: scripts/nix_retry.sh nix build --no-link $(python3 -c 'import sys; sys.path.insert(0, "asic/spice"); import pads; print(*(pads.TOOLS[t] for t in sys.argv[1:]))' ngspice)

      - name: The netlist and the RTL's reference
        uses: actions/download-artifact@v8
        with:
          name: transistor-netlist
          path: work

      - name: Simulate window 1 of 4
        run: |
          python3 asic/spice/chip.py ci --work work --corner ${{ matrix.corner }} --threads 4 \
            --steps simulate --segment 1/4
          tail -n 40 work/${{ matrix.corner }}/seg/*.log | grep -E "Total analysis|iterations|timepoints" || true

      - uses: actions/upload-artifact@v6
        with:
          name: transistor-${{ matrix.corner }}-1
          path: work/${{ matrix.corner }}/seg
          retention-days: 14

  window2:
    name: window 2 of 4 (${{ matrix.corner }})
    needs: window1
    if: inputs.windows >= 2
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        corner: ${{ fromJSON(inputs.corners) }}
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://nix-cache.fossi-foundation.org
            extra-trusted-public-keys = nix-cache.fossi-foundation.org:3+K59iFwXqKsL7BNu6Guy0v+uTlwsxYQxjspXzqLYQs=
            extra-experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # the PDK as asic-pdk.yml caches it for the GF180 chip (read only)
      - name: The PDK from the ASIC job's cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ciel
          key: ciel-gf180mcu-librelane-${{ env.LIBRELANE_VERSION }}

      - name: Fetch the PDK (LibreLane's ciel)
        run: |
          root=$(python3 -c "import sys; sys.path.insert(0, 'asic/spice'); import pads; print(pads.PDKS['gf180mcu']['root'])")
          [ -d ~/.ciel/ciel/$root ] ||
            scripts/nix_retry.sh nix run github:librelane/librelane/$LIBRELANE_VERSION#python3.pkgs.ciel -- fetch --pdk-root ~/.ciel \
              --pdk-family $(cut -d/ -f1 <<< "$root") $(cut -d/ -f3 <<< "$root")

      - name: The simulators, pinned (nix; a broken download again, then built)
        run: scripts/nix_retry.sh nix build --no-link $(python3 -c 'import sys; sys.path.insert(0, "asic/spice"); import pads; print(*(pads.TOOLS[t] for t in sys.argv[1:]))' ngspice)

      - name: The netlist and the RTL's reference
        uses: actions/download-artifact@v8
        with:
          name: transistor-netlist
          path: work

      - name: Windows 1-1 at ${{ matrix.corner }}
        uses: actions/download-artifact@v8
        with:
          name: transistor-${{ matrix.corner }}-1
          path: work/${{ matrix.corner }}/seg

      - name: Simulate window 2 of 4
        run: |
          python3 asic/spice/chip.py ci --work work --corner ${{ matrix.corner }} --threads 4 \
            --steps simulate --segment 2/4
          tail -n 40 work/${{ matrix.corner }}/seg/*.log | grep -E "Total analysis|iterations|timepoints" || true

      - uses: actions/upload-artifact@v6
        with:
          name: transistor-${{ matrix.corner }}-2
          path: work/${{ matrix.corner }}/seg
          retention-days: 14

  window3:
    name: window 3 of 4 (${{ matrix.corner }})
    needs: window2
    if: inputs.windows >= 3
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        corner: ${{ fromJSON(inputs.corners) }}
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://nix-cache.fossi-foundation.org
            extra-trusted-public-keys = nix-cache.fossi-foundation.org:3+K59iFwXqKsL7BNu6Guy0v+uTlwsxYQxjspXzqLYQs=
            extra-experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # the PDK as asic-pdk.yml caches it for the GF180 chip (read only)
      - name: The PDK from the ASIC job's cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ciel
          key: ciel-gf180mcu-librelane-${{ env.LIBRELANE_VERSION }}

      - name: Fetch the PDK (LibreLane's ciel)
        run: |
          root=$(python3 -c "import sys; sys.path.insert(0, 'asic/spice'); import pads; print(pads.PDKS['gf180mcu']['root'])")
          [ -d ~/.ciel/ciel/$root ] ||
            scripts/nix_retry.sh nix run github:librelane/librelane/$LIBRELANE_VERSION#python3.pkgs.ciel -- fetch --pdk-root ~/.ciel \
              --pdk-family $(cut -d/ -f1 <<< "$root") $(cut -d/ -f3 <<< "$root")

      - name: The simulators, pinned (nix; a broken download again, then built)
        run: scripts/nix_retry.sh nix build --no-link $(python3 -c 'import sys; sys.path.insert(0, "asic/spice"); import pads; print(*(pads.TOOLS[t] for t in sys.argv[1:]))' ngspice)

      - name: The netlist and the RTL's reference
        uses: actions/download-artifact@v8
        with:
          name: transistor-netlist
          path: work

      - name: Windows 1-2 at ${{ matrix.corner }}
        uses: actions/download-artifact@v8
        with:
          name: transistor-${{ matrix.corner }}-2
          path: work/${{ matrix.corner }}/seg

      - name: Simulate window 3 of 4
        run: |
          python3 asic/spice/chip.py ci --work work --corner ${{ matrix.corner }} --threads 4 \
            --steps simulate --segment 3/4
          tail -n 40 work/${{ matrix.corner }}/seg/*.log | grep -E "Total analysis|iterations|timepoints" || true

      - uses: actions/upload-artifact@v6
        with:
          name: transistor-${{ matrix.corner }}-3
          path: work/${{ matrix.corner }}/seg
          retention-days: 14

  window4:
    name: window 4 of 4 (${{ matrix.corner }})
    needs: window3
    if: inputs.windows >= 4
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        corner: ${{ fromJSON(inputs.corners) }}
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://nix-cache.fossi-foundation.org
            extra-trusted-public-keys = nix-cache.fossi-foundation.org:3+K59iFwXqKsL7BNu6Guy0v+uTlwsxYQxjspXzqLYQs=
            extra-experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # the PDK as asic-pdk.yml caches it for the GF180 chip (read only)
      - name: The PDK from the ASIC job's cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ciel
          key: ciel-gf180mcu-librelane-${{ env.LIBRELANE_VERSION }}

      - name: Fetch the PDK (LibreLane's ciel)
        run: |
          root=$(python3 -c "import sys; sys.path.insert(0, 'asic/spice'); import pads; print(pads.PDKS['gf180mcu']['root'])")
          [ -d ~/.ciel/ciel/$root ] ||
            scripts/nix_retry.sh nix run github:librelane/librelane/$LIBRELANE_VERSION#python3.pkgs.ciel -- fetch --pdk-root ~/.ciel \
              --pdk-family $(cut -d/ -f1 <<< "$root") $(cut -d/ -f3 <<< "$root")

      - name: The simulators, pinned (nix; a broken download again, then built)
        run: scripts/nix_retry.sh nix build --no-link $(python3 -c 'import sys; sys.path.insert(0, "asic/spice"); import pads; print(*(pads.TOOLS[t] for t in sys.argv[1:]))' ngspice)

      - name: The netlist and the RTL's reference
        uses: actions/download-artifact@v8
        with:
          name: transistor-netlist
          path: work

      - name: Windows 1-3 at ${{ matrix.corner }}
        uses: actions/download-artifact@v8
        with:
          name: transistor-${{ matrix.corner }}-3
          path: work/${{ matrix.corner }}/seg

      - name: Simulate window 4 of 4
        run: |
          python3 asic/spice/chip.py ci --work work --corner ${{ matrix.corner }} --threads 4 \
            --steps simulate --segment 4/4
          tail -n 40 work/${{ matrix.corner }}/seg/*.log | grep -E "Total analysis|iterations|timepoints" || true

      - uses: actions/upload-artifact@v6
        with:
          name: transistor-${{ matrix.corner }}-4
          path: work/${{ matrix.corner }}/seg
          retention-days: 14

  # Xyce's build, from the cache (xyce.yml); Xyce on each window ngspice
  # has run, against ngspice's pins and the RTL's (xyce-window.yml)
  xyce-build:
    name: Xyce
    uses: ./.github/workflows/xyce.yml

  xyce1:
    name: Xyce, window 1
    needs: [window1, xyce-build]
    uses: ./.github/workflows/xyce-window.yml
    with:
      window: 1
      corners: ${{ inputs.corners }}

  xyce2:
    name: Xyce, window 2
    needs: [window2, xyce-build]
    uses: ./.github/workflows/xyce-window.yml
    with:
      window: 2
      corners: ${{ inputs.corners }}

  xyce3:
    name: Xyce, window 3
    needs: [window3, xyce-build]
    uses: ./.github/workflows/xyce-window.yml
    with:
      window: 3
      corners: ${{ inputs.corners }}

  xyce4:
    name: Xyce, window 4
    needs: [window4, xyce-build]
    uses: ./.github/workflows/xyce-window.yml
    with:
      window: 4
      corners: ${{ inputs.corners }}

  figures:
    name: the pins, the AC parameters and the figures
    needs: [netlist, window4]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: The netlist and the RTL's reference
        uses: actions/download-artifact@v8
        with:
          name: transistor-netlist
          path: work

      - name: Every corner's windows
        uses: actions/download-artifact@v8
        with:
          pattern: transistor-*-4
          path: windows

      - name: Stitch the windows, measure, draw
        env:
          CORNERS: ${{ inputs.corners }}
        run: |
          rc=0
          for c in $(python3 -c "import json, os; print(' '.join(json.loads(os.environ['CORNERS'])))"); do
            mkdir -p work/$c && cp -r windows/transistor-$c-4 work/$c/seg
            out=spice/chip/gf180mcu; [ "$c" = tt ] || out=$out/$c
            python3 asic/spice/chip.py ci --work work --corner $c --steps stitch,figures --segment 4/4 \
              --sta asic/spice/findings/pin_timing/rz80-gf180mcu-chip-pin_timing.txt --out $out | tee $c.txt || rc=1
            { echo "### $c"; echo '```'; cat $c.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          # the run, for the site's page (pages.yml, dist.py ci_page)
          printf '{"run_id": "%s", "sha": "%s", "ref": "%s", "date": "%s", "targets_run": "%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u '+%Y-%m-%d %H:%M UTC')" \
            "${{ needs.netlist.outputs.targets_run }}" > spice/run.json
          exit $rc

      - uses: actions/upload-artifact@v6
        if: always()      # a failed check's results too, to look at (pages.yml publishes only a passed run)
        with:
          name: transistor-gf180mcu
          path: spice/
          retention-days: 90
