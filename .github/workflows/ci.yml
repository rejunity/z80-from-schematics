name: CI

# Every push, PR, nightly run and manual dispatch runs every job below,
# except zexall-subset-rtl (Verilator, ~25-55 min): main pushes, the
# nightly run and dispatch only. No job tolerates a failure: every suite
# must pass in full.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * *'        # 04:00 UTC daily
  workflow_dispatch: {}

# Cancel stale runs of the same branch/PR when a newer push lands —
# avoids burning minutes on commits the user has already superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =====================================================================
  # Jobs split by tool surface, each installing only what it needs.
  # =====================================================================

  c-tests:
    name: C model (ctest, FUSE, prelim, HALT-to-INT, silicon, lockstep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3
      - name: C unit tests (tests/common, 13 binaries)
        run: make ctest
      - name: FUSE's 1356 cases through the C model
        run: make fuse
      - name: Cringle's prelim through the C model
        run: make prelim
      - name: HALT-to-INT delays equal the die's
        run: make halt2int
      - name: Real-silicon T-state oracle (sigrok KC85 capture)
        run: make silicon_cycles
      - name: Real-silicon sub-T-state timing (sigrok 20 MHz capture)
        run: make silicon_async
      - name: 5-way lockstep on ZEXDOC3 (ours + superzazu + floooh/chips + suzukiplan + redcode)
        run: make lockstep

  rtl-tests:
    name: RTL (iverilog elaboration + FUSE through RTL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install C + iverilog
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 iverilog
      - name: RTL elaboration smoke (iverilog)
        run: make rtl
      - name: Registered bus controls and decoder skew
        run: make bus_controls
      - name: FUSE's 1356 cases through the iverilog RTL
        run: make fuse_rtl
      # the chip flows' pin-timing SDC is generated from the NMOS Z80
      # datasheet table (asic/timing/); the committed one must match
      - name: NMOS pin-timing SDC up to date
        run: make timing_sdc_check

  basic-c-tests:
    name: BASIC ROM via C model (NASCOM 4.7c + Tiny BASIC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3
      - name: Pipe canned scripts through basicrunner and verify output
        run: make basic_c_tests

  basic-rtl-tests:
    name: BASIC ROM via Verilator RTL (NASCOM 4.7c + Tiny BASIC)
    runs-on: ubuntu-latest
    # With --exit-on sentinel handling, the whole suite finishes in <2 s
    # of sim time (each subtest only runs ~100-150K instructions past
    # its "DONE-XYZ" before exiting the grace window). The 45 min
    # timeout stays as a safety net: real wall clock is dominated by
    # apt install + Verilator build (~1-2 min).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install C + Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 verilator
      - name: Pipe canned scripts through sim_basic (Verilated RTL) and verify
        run: make basic_rtl_tests

  z80test:
    name: Patrik Rak z80test (doc / flags / memptr / full / ccf)
    runs-on: ubuntu-latest
    # 5 variants × ~20-60 s each + cold start = ~4 min
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3
      - name: Run Rak's z80doc + z80flags + z80memptr + z80full + z80ccf; any failed test fails
        run: make z80test

  z80test-rtl:
    name: Patrik Rak z80test through Verilator RTL (${{ matrix.variant }})
    runs-on: ubuntu-latest
    # Verilator is ~20x slower than the C model on Rak's workload: one
    # variant per job, ~6-15 min each including the Verilator build
    # (slow runners have been seen at half the usual speed).
    strategy:
      fail-fast: false
      matrix:
        variant: [z80doc, z80flags, z80memptr, z80full, z80ccf]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install C + Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 verilator
      - name: Run Rak ${{ matrix.variant }} through the RTL; any failed test fails
        run: make z80test_rtl Z80TEST_VARIANTS=${{ matrix.variant }}

  parity-tests:
    name: Parity (C vs iverilog vs Verilator, and vs the die in perfectz80)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install C + iverilog + Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 iverilog verilator
      - name: Build Verilator sim (sim_z80) so compare actually exercises it
        run: make verilator
      - name: C vs iverilog vs Verilator parity (10 hand + 4 random trace programs)
        run: make compare
      - name: C model vs perfectz80 (signal-timing)
        # Every half-cycle: the control pins, the address and the data
        # under WR; any difference fails.
        run: make perfectz80
      - name: iverilog RTL vs perfectz80 (signal-timing)
        # Same 14 trace programs, but the trace source is the iverilog RTL
        # testbench (build/tb_z80.vvp) rather than the C model. Random
        # programs (prog_rnd_01..04 from scripts/gen_random_trace_progs.py)
        # give opcode-mix coverage no hand-written program would have.
        run: make perfectz80_rtl
      - name: Pin-scenario programs vs perfectz80 — C path
        # 15 trace programs (prog9..prog23) that drive INT / NMI / WAIT /
        # BUSREQ / RESET via the .events sidecar; every phase's control
        # pins, address and data under WR must match the die.
        run: make pin_scenarios
      - name: Pin-scenario programs vs perfectz80 — iverilog RTL path
        # Same 15 scenarios through the iverilog RTL testbench. .events
        # is plumbed via per-pin +<pin>_lo / +<pin>_hi plusargs
        # (compare_signal_timing.py encodes the sidecar).
        run: make pin_scenarios_rtl
      - name: FUSE's 1356 cases on the die (perfectz80)
        # Every case behind a preamble that loads its registers; the die's
        # registers, WZ, PC, R, T-states and memory must match
        # tests.expected, or tests/fuse/silicon.expected (six cases).
        run: make fuse_pz80
      - name: Upload per-program VCDs as artifact (open in GTKWave / Surfer)
        # compare_signal_timing.py + the pin-scenario runner emit
        # build/vcd/<prog>.<source>.vcd containing both our pins (top
        # scope) and perfectz80's pins (perfectz80.* scope) so the two
        # render side-by-side from one file. Keep them for ~14 days
        # post-CI for offline inspection.
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: parity-vcds
          path: build/vcd/
          if-no-files-found: warn
          retention-days: 14

  event-sweep:
    name: Pin sweep, every opcode and timing class (RTL + C vs perfectz80) ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    # 37,846 cases in four shards (docs/event-sweep.md): RESET / INT / NMI
    # / BUSREQ / WAIT at every T-state of the targets and of one opcode of
    # every timing class, every opcode with BUSREQ and WAIT walked through
    # it, the data latch of every kind of read, combinations and 2,000
    # fuzz cases; nightly also RESET at every half-cycle of every opcode
    # (opcodes_reset) and 500 fresh fuzz cases. Each runs through the
    # RTL and the C model; perfectz80's side comes from its recorded traces
    # (tests/event_sweep/pz80/), and runs only for a case they don't have.
    # Shard 0 also runs 50 recorded cases through perfectz80 live and fails
    # on any difference from the recording (a harness change that needed
    # HARNESS_VERSION bumped).
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install C + iverilog
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 iverilog
      - name: Sweep RESET / INT / NMI / BUSREQ / WAIT across T-states and clock halves
        # Fails on any difference from perfectz80 and on any half-cycle
        # where the C model differs from the RTL (docs/event-sweep.md).
        run: make event_sweep EVENT_SWEEP_ARGS="--shard ${{ matrix.shard }}/4 ${{ matrix.shard == 0 && '--verify-recorded 50' || '' }}"
      - name: RESET at every half-cycle of every opcode (the nightly run)
        # Group opcodes_reset: 27,768 cases, recorded like the others, about
        # 10 more minutes a shard; too long for every push.
        if: github.event_name == 'schedule'
        run: make event_sweep EVENT_SWEEP_ARGS="--groups opcodes_reset --shard ${{ matrix.shard }}/4 --out build/event_sweep_opcodes_reset"
      - name: Fuzz with fresh seeds (the nightly run)
        # 500 cases nobody has run before -- random code, interrupt modes and
        # pin events (docs/event-sweep.md), perfectz80 live -- in the
        # scheduled run only, in shard 0. A difference fails the job; its
        # seed is the run id, so the case can be run again locally with
        # --groups fuzz --fuzz-seed <run id> --fuzz-n 500 --match <case>.
        if: github.event_name == 'schedule' && matrix.shard == 0
        run: >-
          python3 scripts/event_sweep.py --groups fuzz --fuzz-seed ${{ github.run_id }}
          --fuzz-n 500 --c-model --jobs 4 --out build/event_sweep_fuzz
      - name: Upload report and per-case side-by-side traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: event-sweep-${{ matrix.shard }}
          path: |
            build/event_sweep/report.md
            build/event_sweep/diff/
            build/event_sweep_fuzz/report.md
            build/event_sweep_fuzz/diff/
            build/event_sweep_opcodes_reset/report.md
            build/event_sweep_opcodes_reset/diff/
          if-no-files-found: warn
          retention-days: 14

  # =====================================================================
  # LIBRELANE GATE-LEVEL — "ultimate test". Synthesise rtl/*.v via
  # LibreLane (Yosys.Synthesis only) into a sky130 gate-level netlist,
  # then diff the synthesised netlist's per-half-cycle pin behaviour
  # against the perfectz80 Visual-Z80 gate-level netlist. See
  # docs/librelane-flow.md for the full plan.
  #
  # Heavy step. First cold run on a CI runner is ~8-10 min (nix store
  # download + librelane install + sky130 PDK fetch + ~2 min synth).
  # Subsequent runs are ~30 s when the synth-output cache is warm and
  # ~5 min when only the nix-store cache is warm.
  #
  # Gated to every push during development per user direction.
  # =====================================================================

  librelane-netlist:
    name: LibreLane gate-level sim vs perfectz80 (14 programs + 15 pin scenarios)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix (Determinate Systems)
        uses: DeterminateSystems/nix-installer-action@main
        with:
          # Configure the fossi-foundation nix cache up front so all
          # downstream `nix` invocations pull pre-built LibreLane
          # binaries (iverilog, openroad, yosys-with-plugins, etc.)
          # instead of building from source. Without this, nix tries
          # to rebuild iverilog's pinned snapshot whose self-test suite
          # has 1 flaky case on x86_64-linux (Ran 297, Failed 1) →
          # derivation fails → librelane install fails. Verified URL +
          # public key from
          # librelane.readthedocs.io/en/latest/installation/nix_installation/installation_linux.html
          extra-conf: |
            extra-substituters = https://nix-cache.fossi-foundation.org
            extra-trusted-public-keys = nix-cache.fossi-foundation.org:3+K59iFwXqKsL7BNu6Guy0v+uTlwsxYQxjspXzqLYQs=
            extra-experimental-features = nix-command flakes

      - name: Cache /nix/store across runs
        # Speeds up subsequent runs by ~10x. First cold run still has
        # to fetch the LibreLane closure from the fossi-foundation
        # cache (~5 min). Following runs warm from GHA cache (~30 s).
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Install LibreLane via nix profile
        run: nix profile install github:librelane/librelane

      - name: Cache synthesised netlist on (rtl + librelane config) hash
        id: synth-cache
        uses: actions/cache@v4
        with:
          path: build/synth
          key: synth-${{ hashFiles('rtl/*.v', 'asic/librelane/config.json', 'asic/librelane/run_synth.sh') }}

      - name: Install C toolchain + iverilog
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 iverilog

      - name: Run LibreLane synthesis (skipped on cache hit)
        if: steps.synth-cache.outputs.cache-hit != 'true'
        run: make synth

      - name: Build gate-level iverilog testbench (sky130 cells)
        run: make iverilog_netlist

      - name: Gate-level netlist vs perfectz80 (10 hand + 4 random = 14 programs)
        run: make perfectz80_netlist

      - name: Pin-scenarios vs perfectz80 — gate-level netlist
        # The 15 pin-scenario programs (prog9..prog23) driven through the
        # synthesised sky130 netlist via tb_z80_netlist.v's .events
        # plusarg support; gated like the C and iverilog paths.
        run: make pin_scenarios_netlist

      - name: Upload synthesised netlist artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: synth-netlist
          path: build/synth/z80_top.nl.v
          retention-days: 30
      - name: Upload gate-level netlist per-program VCDs
        # build/vcd/<prog>.netlist.vcd from perfectz80_netlist +
        # pin_scenarios_netlist. Each contains our synthesised-netlist
        # pins + perfectz80's gate-level pins under perfectz80.* scope
        # for direct comparison.
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: netlist-vcds
          path: build/vcd/
          if-no-files-found: warn
          retention-days: 14

  # =====================================================================
  # LIBRELANE GATE-LEVEL + BASIC — same synthesised netlist as
  # librelane-netlist, but instead of 200-phase trace programs we run
  # "real software" (NASCOM BASIC 4.7c + 1 KiB Tiny BASIC) through the
  # gates. Catches synthesis-introduced bugs that 200-phase traces never
  # exercise — anything that takes millions of cycles of ROM boot,
  # interrupt-driven RX, ACIA polling, etc. to manifest.
  #
  # ~5-10 min wall clock (Verilator's gate-level build dominates); runs
  # on every push.
  # =====================================================================

  librelane-basic-netlist:
    name: LibreLane gate-level BASIC (NASCOM 4.7c + Tiny BASIC)
    runs-on: ubuntu-latest
    # Runs on every push. Measured wall clock on a warm-cache runner is
    # ~9 min: nix install (~1 min) + Verilator gate-level build (~4 min)
    # + 4 canned BASIC subtests on the synthesised netlist (~3 min). The
    # synth output is cached on hash(rtl/*.v + asic/librelane/config.json +
    # run_synth.sh) so most pushes skip the ~3 min synthesis step.
    # The 60 min is a safety net, not a budget: each BASIC subtest also
    # carries its own --max-seconds wall-clock budget (see
    # tests/basic/run_basic_tests.sh) so a broken/slow simulator build
    # fails in minutes with a rate printed instead of hanging here.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix (Determinate Systems)
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://nix-cache.fossi-foundation.org
            extra-trusted-public-keys = nix-cache.fossi-foundation.org:3+K59iFwXqKsL7BNu6Guy0v+uTlwsxYQxjspXzqLYQs=
            extra-experimental-features = nix-command flakes

      - name: Cache /nix/store across runs
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Install LibreLane via nix profile
        run: nix profile install github:librelane/librelane

      - name: Cache synthesised netlist on (rtl + librelane config) hash
        id: synth-cache
        uses: actions/cache@v4
        with:
          path: build/synth
          key: synth-${{ hashFiles('rtl/*.v', 'asic/librelane/config.json', 'asic/librelane/run_synth.sh') }}

      - name: Install C toolchain (no apt verilator — see below)
        # apt's Verilator on Ubuntu 24.04 is 5.020 which lacks Verilog-1995
        # UDP table parsing. The sky130 FUNCTIONAL cell models instantiate
        # UDP primitives (sky130_fd_sc_hd__udp_dff$P etc.) as their DFF
        # storage elements — without UDP table support the cells become
        # empty modules and the gate-level Z80 doesn't store state.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3

      - name: Install Verilator 5.048 from nixpkgs nixos-26.05 (UDP-table capable, known-good)
        # LibreLane's own `nix profile install github:librelane/librelane`
        # does NOT put Verilator on PATH — librelane is a Python CLI that
        # references its bundled tools by absolute /nix/store paths. We
        # need a top-level Verilator on PATH explicitly.
        #
        # PINNED to the nixos-26.05 release branch (Verilator 5.048) rather
        # than nixpkgs-unstable. Unstable moved to 5.052 in autumn 2026 and
        # from 5.050 on the sky130 FUNCTIONAL cell models (UDP dff
        # primitives) are mis-simulated: the gate-level Z80 executes but
        # with a wrong refresh/R count and ~17 instead of ~38 phases per
        # instruction, so NASCOM BASIC never reaches its prompt and this job
        # spun until the 60-minute timeout (nightly 2026-10-11..16). 5.040
        # and 5.048 reproduce the C-model trace exactly. Needs >= 5.030 for
        # UDP table parsing (apt's 5.020 lacks it — see the previous step).
        # Bump deliberately, after re-running `make basic_netlist_tests`.
        run: nix profile install github:NixOS/nixpkgs/nixos-26.05#verilator

      - name: Verify Verilator version (must be UDP-table capable)
        run: |
          which verilator
          verilator --version

      - name: Run LibreLane synthesis (skipped on cache hit)
        if: steps.synth-cache.outputs.cache-hit != 'true'
        run: make synth

      - name: Build gate-level Verilator BASIC sim (sky130 cells)
        run: make verilator_basic_netlist

      - name: Run canned BASIC subtests on the synthesised netlist
        run: make basic_netlist_tests

  # =====================================================================
  # cfast: the model's pins in every phase, then its speed (the benchmark
  # of cfast/BENCHMARK.md), on every push
  # =====================================================================
  cfast-bench:
    name: cfast against the model phase by phase, and its speed (ZEXDOC)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3
      - name: cfast phase by phase against the model (make cfast_identity)
        # every pin of every phase through z80f_tick and z80f_run, and the
        # registers every 1M phases, against the model of this commit
        # (PHASE_REF=HEAD): ZEXDOC, z80test, every trace program and pin
        # scenario, random code under random INT / NMI / WAIT / BUSREQ /
        # RESET (scripts/phase_identity.py)
        run: make cfast_identity
      - name: Build every emulator and run them on ZEXDOC
        # scripts/cfast_bench.py: 50M instructions each, the best of 5
        # interleaved rounds of CPU time, every run on CPU 1 alone. Fails if
        # an emulator stops early or runs other instructions than the model.
        run: make cfast_bench CFAST_BENCH_ARGS="--cpu 1 --rounds 5"
      - name: The table, in the job's summary
        run: cat build/bench/bench.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the table, the numbers and the chart (the site shows the latest, pages.yml)
        uses: actions/upload-artifact@v6
        with:
          name: cfast-bench
          path: build/bench/
          retention-days: 90

  # =====================================================================
  # ZEX TIER (C model) — runs on every event, including every push.
  # ZEXDOC and ZEXALL are independent jobs so they run in parallel
  # (~18 + 19 min serial -> ~19 min parallel wall clock). Neither
  # depends on the fast tier — each has its own self-contained build
  # (no iverilog/verilator needed).
  # =====================================================================

  zexdoc:
    name: ZEXDOC (~15-40 min via C model)
    runs-on: ubuntu-latest
    # runner speed varies ~2.5x: 15-39 min over October's main runs
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - name: Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3
      - name: Run ZEXDOC and fail on any ERROR line
        run: |
          make zexrunner
          set -o pipefail
          # stdbuf -oL forces line buffering on the zexrunner pipe so each
          # Cringle "<test> ...  OK" line streams to the live log as soon
          # as it's emitted — without this glibc block-buffers stdout when
          # not a TTY and you only see output after the ~18 min run ends.
          stdbuf -oL build/bin/zexrunner tests/zex/zexdoc.com 6000000000 2>&1 \
            | stdbuf -oL tr -d '\r' | tee zexdoc.log
          if grep -q ERROR zexdoc.log; then
            echo "::error::ZEXDOC reported ERROR — see lines above"
            exit 1
          fi
          grep -q 'Tests complete' zexdoc.log || { echo "::error::ZEXDOC did not finish"; exit 1; }
      - name: Upload ZEXDOC log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zexdoc-log
          path: zexdoc.log
          retention-days: 14

  zexall:
    name: ZEXALL (~15-40 min via C model)
    runs-on: ubuntu-latest
    # runner speed varies ~2.5x: 15-39 min over October's main runs
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - name: Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3
      - name: Run ZEXALL and fail on any ERROR line
        run: |
          make zexrunner
          set -o pipefail
          stdbuf -oL build/bin/zexrunner tests/zex/zexall.com 12000000000 2>&1 \
            | stdbuf -oL tr -d '\r' | tee zexall.log
          if grep -q ERROR zexall.log; then
            echo "::error::ZEXALL reported ERROR — see lines above"
            exit 1
          fi
          grep -q 'Tests complete' zexall.log || { echo "::error::ZEXALL did not finish"; exit 1; }
      - name: Upload ZEXALL log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zexall-log
          path: zexall.log
          retention-days: 14

  # =====================================================================
  # RTL ZEXALL via Verilator — apples-to-apples with the C-side zexall,
  # but every cycle simulated at gate-level-equivalent fidelity. Verilator
  # is ~20x slower than the C model, so this is gated to push-to-main /
  # nightly cron / manual dispatch (~25-55 min wall clock). The full
  # 67-test ZEXALL would take several hours through Verilator (the C
  # model's ZEXALL job above runs all 67); this slice keeps the families
  # most prone to error.
  # =====================================================================

  zexall-subset-rtl:
    name: ZEXALL 14-test subset via Verilator RTL (~25-55 min)
    runs-on: ubuntu-latest
    # Same gate as a former full-ZEXALL-RTL job — runs only on push to
    # main / master, nightly cron, or manual dispatch. Branch-push
    # builds skip this leg; the C-side ZEXDOC + ZEXALL still run on
    # every push so day-to-day branches don't lose coverage.
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
      || github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    # The subset is the curated audit-focused 14-test slice of ZEXALL
    # (LDIR/LDDR/CPIR/CPDR + DDCB variants + RRD/RLD + NEG + DAA/SCF/CCF
    # + 16-bit ADC/SBC HL,rp). 550M instr on C = ~86 s; Verilator on
    # ubuntu-latest took 24-53 min over October's main runs (the runners'
    # speed varies ~2.5x; the RTL's own speed did not change), so the
    # limit leaves room for the slowest.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install C + Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 verilator
      - name: Run ZEXALL 14-test subset through Verilator RTL; fail on ERROR
        run: |
          set -o pipefail
          stdbuf -oL make zexall_subset_rtl 2>&1 \
            | stdbuf -oL tr -d '\r' | tee zexall_subset_rtl.log
          if grep -q ERROR zexall_subset_rtl.log; then
            echo "::error::ZEXALL subset through Verilator RTL reported ERROR — see lines above"
            exit 1
          fi
          grep -q 'Tests complete' zexall_subset_rtl.log || { echo "::error::the ZEXALL subset did not finish"; exit 1; }
      - name: Upload ZEXALL-subset-RTL log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zexall-subset-rtl-log
          path: zexall_subset_rtl.log
          retention-days: 14
