# This board's bitstreams and simulations (`make ci` in fpga/icebreaker/)
# on every push to this branch and on demand. The job is fpga-board.yml,
# which targets.yml also runs nightly on main's core.
name: fpga-icebreaker

on:
  push:
    branches: [fpga-icebreaker-basic]
  workflow_dispatch: {}

jobs:
  board:
    uses: ./.github/workflows/fpga-board.yml
    with:
      board: icebreaker
