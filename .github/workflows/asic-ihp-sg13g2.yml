# RTL-to-GDS of z80_top on ihp-sg13g2 (LibreLane Classic flow, the bare
# core -- no pad ring), the sign-off checks, and the signs-of-life program
# on the routed netlist, on every push to this branch and on demand. The
# job is asic-pdk.yml, which targets.yml also runs nightly on main's core.
# See asic/ihp-sg13g2/README.md.
name: asic-ihp-sg13g2

on:
  push:
    branches: [asic-ihp-sg13g2]
  workflow_dispatch: {}

jobs:
  harden:
    uses: ./.github/workflows/asic-pdk.yml
    with:
      pdk: ihp-sg13g2
