# LibreLane 3 Classic flow: harden z80_top as a stand-alone macro on
# gf180mcuD / gf180mcu_fd_sc_mcu7t5v0 -- the PDK and cell library used
# by both the TinyTapeout GF180 shuttles (ttgf26d: LibreLane 3.0.14,
# gf180mcu 54435919) and the wafer.space template default (gf180mcuD
# f6eeac7d, 7-track 5V0 cells, gf180mcu_fd_io pads).
#
# This is a tapeout-readiness probe of the core itself (synthesis ->
# floorplan -> place -> CTS -> route -> STA -> DRC/LVS/antenna), not a
# shuttle submission: no TinyTapeout tile wrapper and no pads yet.
meta:
  version: 3
  flow: Classic

DESIGN_NAME: z80_top
VERILOG_FILES:
  - dir::../../rtl/*.v
VERILOG_INCLUDE_DIRS:
  - dir::../../rtl

# Synthesize each RTL module on its own and flatten only afterwards: the
# cell names keep their block (u_core.u_alu._123_), which the block map
# of the layout colours by (.github/scripts/dist.py), and the die keeps
# the RTL's block structure. On gf180 this cost ~3 % cells against
# flattening first (8,654 vs 8,391); timing was unchanged.
SYNTH_HIERARCHY_MODE: deferred_flatten

# ---- z80_top is the hard macro of the chip (chip/) ----
# Pins on the sides of their pads, in pad order -- the original Z80's
# bond pad order -- so the chip's pad wires are short. pin_order.cfg:
#   S  A5 ... A15 CLK                      (left to right)
#   E  D4 D3 D5 D6 (VCC: data_drive) D2 D7 D0 D1, in and out per bit
#   N  WAIT BUSAK WR RD IORQ MREQ HALT NMI INT, then the debug outputs
#   W  A4 A3 A2 A1 A0 (GND) RFSH M1 RESET BUSRQ   (bottom to top)
IO_PIN_ORDER_CFG: dir::pin_order.cfg
# Power straps on one layer only, and routing below the top layer, so the
# chip's power grid crosses over the macro and connects to its straps.
PDN_MULTILAYER: false
RT_MAX_LAYER: Metal4

# Plain buffers on z80_top's ports: the port buffers LibreLane inserts
# (buffer_ports) otherwise come out as this library's delay cells
# (dlyb_1, ~3 ns at the slow corner) on every input and output -- on the
# data inputs that much came off the chip's tightest NMOS margin, the
# opcode's setup TsD(Cr). The core's hold repair needs none of them.
EXTRA_EXCLUDED_CELLS: ["gf180mcu_fd_sc_mcu7t5v0__dly*"]

# Repair timing once more after global routing, on the routed wires'
# parasitics instead of placement estimates (LibreLane leaves this off).
# At the slow corner the resizer had judged its work done, and routing
# then cost 10-20 ns; this pass wins back about a third of it.
RUN_POST_GRT_RESIZER_TIMING: true
RUN_POST_GRT_DESIGN_REPAIR: true

# One Z80-rate clock. 50 ns = 20 MHz, the fastest CMOS Z80 grade
# (Z84C0020). Met at the typical corners LibreLane signs off; the 5 V
# cells at the slow corner (ss, 125 C, 4.5 V) reach ~15.5 MHz (reported,
# not gated -- a looser target only makes the resizer stop earlier). The
# negedge input samplers and the falling-edge half of the pin former make
# some paths half-cycle.
CLOCK_PORT: clk
CLOCK_PERIOD: 50

# Let the die follow the cell area; utilisation is reported so it can be
# compared with TinyTapeout tile and wafer.space slot sizes.
FP_SIZING: relative
FP_CORE_UTIL: 45
PL_TARGET_DENSITY_PCT: 55
