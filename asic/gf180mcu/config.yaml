# LibreLane 3 Classic flow: harden z80_top as a stand-alone macro on
# gf180mcuD / gf180mcu_fd_sc_mcu7t5v0 -- the PDK and cell library used
# by both the TinyTapeout GF180 shuttles (ttgf26d: LibreLane 3.0.14,
# gf180mcu 54435919) and the wafer.space template default (gf180mcuD
# f6eeac7d, 7-track 5V0 cells, gf180mcu_fd_io pads).
#
# This is a tapeout-readiness probe of the core itself (synthesis ->
# floorplan -> place -> CTS -> route -> STA -> DRC/LVS/antenna), not a
# shuttle submission: no TinyTapeout tile wrapper and no pads yet.
meta:
  version: 3
  flow: Classic

DESIGN_NAME: z80_top
VERILOG_FILES:
  - dir::../../rtl/*.v
VERILOG_INCLUDE_DIRS:
  - dir::../../rtl

# One Z80-rate clock. 80 ns = 12.5 MHz: the 5 V cells meet ~14 MHz at
# the slow corner (ss, 125 C, 4.5 V) and ~22 MHz typical; 20 MHz (the
# fastest CMOS Z80 grade) misses the slow corner by ~18 ns. The negedge
# input samplers and the falling-edge half of the pin former make some
# paths half-cycle.
CLOCK_PORT: clk
CLOCK_PERIOD: 80

# Let the die follow the cell area; utilisation is reported so it can be
# compared with TinyTapeout tile and wafer.space slot sizes.
FP_SIZING: relative
FP_CORE_UTIL: 45
PL_TARGET_DENSITY_PCT: 55
