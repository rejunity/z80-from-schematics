# Xyce's fast build (asic/spice/nix/xyce-threaded.nix): Trilinos with
# OpenMP, ShyLU-node Basker, METIS and Amesos' UMFPACK, and Xyce 7.10
# against it -- serial, and over OpenMPI. Built once per version of the
# expression (~40-50 min on a runner), its two own store paths (Trilinos
# and Xyce) exported (nix-store --export, ~70 MB with zstd) with the list
# of their other references -- all on cache.nixos.org -- in one Actions
# cache entry, xyce-<variant>-<the expression's hash>. The
# Xyce jobs after it (CI's cells, the nightly slice, the Transistor run's
# windows) restore that entry through .github/actions/xyce, never build.
# (magic-nix-cache lost these paths: the repository's Actions cache is at
# its 10 GB limit and evicts.) Called by ci.yml and transistor.yml before
# their Xyce jobs; on its own when the expression changes, or by hand.
name: Xyce

on:
  push:
    paths:
      - asic/spice/nix/**
      - .github/workflows/xyce.yml
      - .github/actions/xyce/**
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Xyce's fast build (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        variant: [serial, mpi]
    steps:
      - uses: actions/checkout@v5

      - name: The cache entry, if this expression was built before
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/xyce-nar
          key: xyce-${{ matrix.variant }}-${{ hashFiles('asic/spice/nix/xyce-threaded.nix') }}

      # Trilinos' build tree runs to many GB: the runner's preinstalled
      # SDKs make room (fixed paths; none of them is used here)
      - name: Disk space for the build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-experimental-features = nix-command flakes

      # its own two paths exported, Trilinos first (Xyce refers to it); the
      # rest of the closure only listed: the restore takes it from
      # cache.nixos.org (a binary cache holds no path without its references)
      - name: Build Xyce (${{ matrix.variant }}), and export its own paths
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          t0=$SECONDS
          out=$(scripts/nix_retry.sh nix build -f asic/spice/nix/xyce-threaded.nix --no-link --print-out-paths \
                  ${{ matrix.variant == 'mpi' && '--arg mpi true' || '' }})
          test -x "$out/bin/Xyce"
          all=$(nix-store -qR "$out")
          own="$(grep -- '-trilinos-[0-9]' <<< "$all") $(grep -- '-xyce-[0-9]' <<< "$all")"
          mkdir -p ~/xyce-nar
          grep -v -E -- '-(trilinos|xyce)-[0-9]' <<< "$all" > ~/xyce-nar/refs.txt
          tr ' ' '\n' <<< "$own" > ~/xyce-nar/own.txt
          echo "$out" > ~/xyce-nar/out.txt
          nix-store --export $own | zstd -q -T0 -3 > ~/xyce-nar/own.nar.zst
          echo "built in $((SECONDS - t0)) s: $own; $(wc -l < ~/xyce-nar/refs.txt) references; $(du -h ~/xyce-nar/own.nar.zst | cut -f1)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the cache entry
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/xyce-nar
          key: xyce-${{ matrix.variant }}-${{ hashFiles('asic/spice/nix/xyce-threaded.nix') }}

      # what every Xyce job does with the entry: Xyce into the store from it
      # and cache.nixos.org, nothing built
      - name: Xyce (${{ matrix.variant }}) from the entry, as the Xyce jobs take it
        uses: ./.github/actions/xyce
        with:
          variant: ${{ matrix.variant }}
